<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOCX to PDF Converter | Monochrome Glass</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Background Ambient Glow -->
    <div class="ambient-glow glow-top"></div>
    <div class="ambient-glow glow-bottom"></div>

    <div class="wrapper">
        <main class="glass-container">
            <header class="header">
                <div class="badge">
                    <span class="badge-dot"></span>
                    wconvert
                </div>
                <h1 class="title">DOCX to PDF</h1>
                <p class="description">Ubah dokumen Microsoft Word Anda menjadi PDF berkualitas tinggi secara cepat dan presisi.</p>
            </header>

            <form id="uploadForm" class="upload-form">
                <!-- Drag and Drop Zone -->
                <div class="dropzone" id="dropzone">
                    <input type="file" id="fileInput" name="file" accept=".docx" class="file-input">
                    
                    <div class="dropzone-content" id="dropzoneContent">
                        <div class="icon-box">
                            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                <polyline points="17 8 12 3 7 8"></polyline>
                                <line x1="12" y1="3" x2="12" y2="15"></line>
                            </svg>
                        </div>
                        <p class="dropzone-text">Tarik & Lepas file <span class="highlight">.docx</span> di sini</p>
                        <p class="dropzone-sub">atau klik untuk menjelajah dari komputer Anda</p>
                    </div>

                    <!-- Selected File Info -->
                    <div class="file-card hidden" id="fileCard">
                        <div class="file-card-info">
                            <div class="file-icon">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                                    <polyline points="14 2 14 8 20 8"></polyline>
                                </svg>
                            </div>
                            <div class="file-meta">
                                <span class="file-name" id="fileName">document.docx</span>
                                <span class="file-size" id="fileSize">0 KB</span>
                            </div>
                        </div>
                        <button type="button" class="btn-remove" id="btnRemove" title="Hapus file">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="18" y1="6" x2="6" y2="18"></line>
                                <line x1="6" y1="6" x2="18" y2="18"></line>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Convert Button -->
                <button type="submit" class="btn-convert" id="btnConvert" disabled>
                    <span class="btn-label" id="btnLabel">Konversi ke PDF</span>
                    <span class="btn-spinner hidden" id="btnSpinner">
                        <span class="spinner-ring"></span>
                        <span>Mengonversi Dokumen...</span>
                    </span>
                </button>
            </form>
        </main>
    </div>

    <!-- Toast Notification Container -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="/static/script.js"></script>
</body>
</html>
